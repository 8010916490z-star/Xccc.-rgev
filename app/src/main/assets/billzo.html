<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E6E5C">
<title>BillZo — Billing, Inventory & GST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E6E5C'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F5F6F8;--surface:#fff;--surface2:#F0F2F5;--border:#E2E5EA;--text:#141820;--muted:#65707E;--faint:#98A1AD;
--primary:#0E6E5C;--primary2:#0A5547;--psoft:#E2F1EC;--accent:#E89B2C;--asoft:#FCF0DC;
--danger:#C8322A;--dsoft:#FBE7E5;--ok:#12865A;--osoft:#E1F3EA;--info:#2D63C8;--isoft:#E4ECFA;--warn:#B8720A;
--r:12px;--r2:8px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh2:0 12px 32px rgba(16,24,40,.16);
--font:'Plus Jakarta Sans','Noto Sans','Noto Sans Devanagari',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme=dark]{--bg:#0D1114;--surface:#151A1F;--surface2:#1B2127;--border:#29313A;--text:#E7EBEE;--muted:#97A3AE;--faint:#6B7782;
--primary:#2BB394;--primary2:#239a7f;--psoft:#12332C;--accent:#F0AE4A;--asoft:#3A2A12;--danger:#F06A5F;--dsoft:#3A1A18;--ok:#3FC488;--osoft:#123224;--info:#6F9BF0;--isoft:#172A4A;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.xs{font-size:11px}.b{font-weight:700}.sb{font-weight:600}
.right{text-align:right}.center{text-align:center}.num{font-variant-numeric:tabular-nums}
.green{color:var(--ok)}.red{color:var(--danger)}.amber{color:var(--warn)}.blue{color:var(--info)}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}.gap4{gap:4px}.gap16{gap:16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2.stack{grid-template-columns:1fr}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1d1404}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}.btn.lg{height:46px;font-size:15px;padding:0 20px}.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.ib{width:36px;height:36px;border-radius:var(--r2);display:inline-grid;place-items:center;border:0;background:transparent;cursor:pointer;color:var(--muted);position:relative}
.ib:hover{background:var(--surface2);color:var(--text)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* forms */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label{font-size:12px;font-weight:600;color:var(--muted)}
.in,select.in,textarea.in{height:40px;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);padding:0 11px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--psoft)}
.in.sm{height:32px;font-size:13px;padding:0 8px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.chk input{width:17px;height:17px;accent-color:var(--primary)}
.sw{position:relative;width:40px;height:23px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.sw span:before{content:'';position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--primary)}.sw input:checked+span:before{transform:translateX(17px)}
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r2);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.card.p0{padding:0;overflow:hidden}
.card h3,.ch{font-size:15px;font-weight:700}
.chd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--psoft);color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--osoft);color:var(--ok)}.badge.bad{background:var(--dsoft);color:var(--danger)}.badge.warn{background:var(--asoft);color:var(--warn)}.badge.info{background:var(--isoft);color:var(--info)}.badge.pri{background:var(--psoft);color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
/* tables & lists */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}.t tbody tr.click{cursor:pointer}.t tbody tr.click:hover{background:var(--surface2)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.li:last-child{border-bottom:0}.li:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:10px;background:var(--psoft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:14px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.li .mn{flex:1;min-width:0}.li .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg.i{width:40px;height:40px;stroke-width:1.4;color:var(--faint);margin-bottom:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.48);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .15s}
.md{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2);animation:up .2s}
.md.wide{max-width:900px}.md.xl{max-width:1100px}.md.sm{max-width:400px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.mh h2{font-size:16px;font-weight:700;flex:1}
.mb{padding:18px;overflow-y:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
@media(max-width:640px){.ov{align-items:flex-end;padding:0}.md{border-radius:18px 18px 0 0;max-height:94vh;max-width:none!important}}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(20px);opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1B222A;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--sh2);display:flex;gap:8px;align-items:center;animation:up .2s;max-width:90vw}
.toast.err{background:var(--danger)}.toast.ok svg{color:#5fe0a5}
.spin{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--surface2),var(--border),var(--surface2));background-size:200%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.divider{height:1px;background:var(--border);margin:12px 0}
.sect{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:16px 0 8px}
.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.pill-tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.pill-tabs button.on{color:var(--primary);border-color:var(--primary)}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px}
.banner.info{background:var(--isoft);color:var(--info)}.banner.warn{background:var(--asoft);color:var(--warn)}.banner.bad{background:var(--dsoft);color:var(--danger)}.banner.ok{background:var(--osoft);color:var(--ok)}
.kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface2)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}

.t th.right,.t td.right{text-align:right}.t th.center,.t td.center{text-align:center}

/* ===== User app layout ===== */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.bizsw{margin:4px 12px 8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;display:flex;gap:9px;align-items:center;cursor:pointer;background:var(--surface2)}
.bizsw .av{width:30px;height:30px;font-size:12px;border-radius:8px}
.nav{padding:4px 10px 16px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--faint);text-transform:uppercase;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.on{background:var(--psoft);color:var(--primary)}
.nav a .k{margin-left:auto;font-size:10px;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:10px 22px;border-bottom:1px solid var(--border);min-height:60px}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{flex:1;max-width:420px;margin-left:auto;position:relative}
.gsearch .in{padding-left:36px;height:38px;background:var(--surface)}
.gsearch>svg{position:absolute;left:11px;top:10px;color:var(--faint)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);max-height:60vh;overflow:auto;z-index:80}
.net{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:0 10px;height:30px;border-radius:20px}
.net.on{color:var(--ok);background:var(--osoft)}.net.off{color:var(--danger);background:var(--dsoft)}
.view{padding:20px 22px 100px;max-width:1400px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.bnav{display:none}
.fab{position:fixed;right:20px;bottom:84px;width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;border:0;display:none;place-items:center;box-shadow:0 8px 20px rgba(14,110,92,.4);cursor:pointer;z-index:55}
.fab svg{width:26px;height:26px}
.scrim{display:none}
@media(max-width:1023px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh2)}
 .side.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:59}
 .top{padding:8px 12px}.view{padding:14px 12px 100px}
 .gsearch{display:none}.gsearch.open{display:block;position:absolute;left:8px;right:8px;top:10px;max-width:none}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:56;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0}
 .bnav a.on{color:var(--primary)}.bnav a svg{width:22px;height:22px}
 .bnav .plus{flex:0 0 64px}.bnav .plus span{width:48px;height:48px;border-radius:15px;background:var(--primary);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(14,110,92,.4)}
 .hide-m{display:none!important}
}
@media(min-width:1024px){.hide-d{display:none!important}}
/* mobile-app mode: always app layout, framed on wide screens */
body.mode-mobile .app{grid-template-columns:1fr;max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--border)}
body.mode-mobile .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s}
body.mode-mobile .side.open{transform:none}
body.mode-mobile .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:59}
body.mode-mobile .top{padding:8px 12px}body.mode-mobile .view{padding:14px 12px 100px}
body.mode-mobile .gsearch{display:none}body.mode-mobile .gsearch.open{display:block;position:absolute;left:8px;right:8px;top:10px;max-width:none}
body.mode-mobile .bnav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--border);z-index:56;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
body.mode-mobile .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0}
body.mode-mobile .bnav a.on{color:var(--primary)}body.mode-mobile .bnav a svg{width:22px;height:22px}
body.mode-mobile .bnav .plus{flex:0 0 64px}body.mode-mobile .bnav .plus span{width:48px;height:48px;border-radius:15px;background:var(--primary);color:#fff;display:grid;place-items:center;margin-top:-22px}
body.mode-mobile .hide-m{display:none!important}body.mode-mobile .hide-d{display:revert!important}
body.mode-mobile .g4,body.mode-mobile .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
body.mode-mobile .g2.stack{grid-template-columns:1fr}
body.mode-mobile .ov{align-items:flex-end;padding:0}body.mode-mobile .md{border-radius:18px 18px 0 0;max-width:520px!important}
body.mode-mobile .split{grid-template-columns:1fr!important}
/* onboarding */
.ob{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.ob-art{background:var(--primary);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ob-art h1{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.03em;max-width:440px}
.ob-art p{opacity:.85;max-width:400px;margin-top:14px;font-size:15px}
.ob-art .feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px}
.ob-art .feat div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.ob-art .ring{position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;border:60px solid rgba(255,255,255,.06)}
.ob-form{display:flex;align-items:center;justify-content:center;padding:28px 20px;background:var(--surface)}
.ob-box{width:100%;max-width:440px}
.ob-box h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.steps{display:flex;gap:5px;margin-bottom:22px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--border)}.steps i.on{background:var(--primary)}
.pick{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto;margin:12px 0;padding-right:2px}
.pick .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;font-weight:600;transition:.15s}
.pick .opt:hover{border-color:var(--faint)}
.pick .opt.on{border-color:var(--primary);background:var(--psoft)}
.pick .opt .tk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center}
.pick .opt.on .tk{background:var(--primary);border-color:var(--primary);color:#fff}
.pick .opt .tk svg{width:14px;height:14px;stroke-width:3}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.devs .opt{flex-direction:column;justify-content:center;padding:22px 8px;text-align:center}
.devs .opt svg.i{width:34px;height:34px;stroke-width:1.5}
.devs .opt .tk{margin:0}
@media(max-width:860px){.ob{grid-template-columns:1fr}.ob-art{display:none}}
body.mode-mobile .ob{grid-template-columns:1fr}body.mode-mobile .ob-art{display:none}
/* invoice editor */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.lines .ln{display:grid;grid-template-columns:minmax(140px,2.4fr) 70px 90px 70px 80px 96px 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.lines .lh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
@media(max-width:760px){.lines .ln{grid-template-columns:1fr 1fr 1fr;}.lines .ln .nm{grid-column:1/-1}.lines .lh{display:none}}
body.mode-mobile .lines .ln{grid-template-columns:1fr 1fr 1fr}body.mode-mobile .lines .ln .nm{grid-column:1/-1}body.mode-mobile .lines .lh{display:none}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.tot.big{font-size:18px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.ac{position:relative}.acl{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh2);z-index:40;max-height:260px;overflow:auto}
.acl .li{padding:9px 12px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pitem{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.12s}
.pitem:hover{border-color:var(--primary);transform:translateY(-1px)}
.pitem .im{height:64px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--faint)}
.pitem .im img{width:100%;height:100%;object-fit:cover}
@media(max-width:1023px){.pos{grid-template-columns:1fr}}
body.mode-mobile .pos{grid-template-columns:1fr}
.lock{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pinpad button{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.pindots{display:flex;gap:12px}.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--primary)}.pindots i.f{background:var(--primary)}
.annbar{background:var(--accent);color:#1d1404;padding:8px 16px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.bnr{border-radius:var(--r);padding:16px 18px;background:linear-gradient(120deg,var(--primary),var(--primary2));color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:14px}
.bnr img{width:64px;height:64px;border-radius:10px;object-fit:cover}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{margin:8mm}}
.ob-box .logo svg{width:34px;height:34px}

/* ---- tiny IndexedDB KV for offline cache + pending writes ---- */
const IDB = { db: null,
  open() { return new Promise(r => { if (!window.indexedDB) return r(null); const q = indexedDB.open('billzo', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => { this.db = q.result; r(q.result); }; q.onerror = () => r(null); }); },
  get(k) { return new Promise(r => { if (!this.db) return r(null); const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); },
  set(k, v) { return new Promise(r => { if (!this.db) return r(); const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = r; tx.onerror = r; }); }
};
let PENDING = {};

function W(path, value) { // write with offline queue
  const k = path; PENDING[k] = { path, value, at: Date.now() }; savePending();
  return db.ref(path).set(value === undefined ? null : value).then(() => { delete PENDING[k]; savePending(); }).catch(e => { logError('write', e.message + ' @' + path); });
}
async function flushPending() { for (const p of Object.values(PENDING)) db.ref(p.path).set(p.value).then(() => { delete PENDING[p.path]; savePending(); }).catch(() => {}); }

}

/* ---- computed values ---- */
function recalc() {
  const C = { paid: {}, bal: {}, stock: {}, whStock: {} };
  const inv = vals(S.d.invoices).filter(i => i.status !== 'cancelled');
  for (const p of vals(S.d.payments)) if (p.invoiceId) C.paid[p.invoiceId] = (C.paid[p.invoiceId] || 0) + num(p.amount);
  for (const p of vals(S.d.parties)) C.bal[p.id] = (p.openingType === 'pay' ? -1 : 1) * num(p.opening);
  for (const i of inv) { const T = TYPES[i.type]; if (T?.led && i.partyId) C.bal[i.partyId] = (C.bal[i.partyId] || 0) + T.led * num(i.totals?.total); }
  for (const p of vals(S.d.payments)) if (p.partyId) C.bal[p.partyId] = (C.bal[p.partyId] || 0) + (p.dir === 'in' ? -1 : 1) * num(p.amount);
  const addS = (id, q, wh) => { C.stock[id] = (C.stock[id] || 0) + q; wh = wh || 'main'; C.whStock[id] = C.whStock[id] || {}; C.whStock[id][wh] = (C.whStock[id][wh] || 0) + q; };
  for (const it of vals(S.d.items)) if (it.type !== 'service' && it.type !== 'combo') addS(it.id, num(it.openingStock), it.warehouseId);
  for (const m of vals(S.d.stockMoves)) { if (m.type === 'transfer') { addS(m.itemId, -num(m.qty), m.from); addS(m.itemId, num(m.qty), m.to); } else addS(m.itemId, num(m.qty), m.whId); }
  for (const i of inv) { const T = TYPES[i.type]; if (!T?.stock) continue;
    for (const l of i.lines || []) { const it = S.d.items[l.itemId]; if (!it) continue;
      if (it.type === 'combo') (it.components || []).forEach(c => addS(c.itemId, T.stock * num(l.qty) * num(c.qty), i.warehouseId));
      else if (it.type !== 'service') addS(it.id, T.stock * num(l.qty), i.warehouseId); } }
  S.calc = C;
}
const due = i => r2(num(i.totals?.total) - num(S.calc.paid[i.id]));
function invStatus(i) { if (i.status === 'cancelled') return ['Cancelled', 'bad']; if (!TYPES[i.type]?.led || TYPES[i.type].led < 0 && i.type !== 'purchase') { if (i.converted) return ['Converted', 'info']; return ['Open', 'info']; }
  const d = due(i); if (d <= 0.01) return ['Paid', 'ok']; if (i.dueDate && i.dueDate < today()) return ['Overdue', 'bad']; if (S.calc.paid[i.id]) return ['Partial', 'warn']; return ['Unpaid', 'warn']; }

  const mm = $('#maint'); if (st.maintenance && !(S.profile && S.profile.tester)) {
    if (!mm) { const d = document.createElement('div'); d.id = 'maint'; d.className = 'lock'; d.innerHTML = `<div class="logo" style="width:56px;height:56px">${ic('tool')}</div><h2>Under maintenance</h2><p class="muted center" style="max-width:340px">${esc(st.maintenanceMsg || 'BillZo is being upgraded. Please check back shortly.')}</p>`; document.body.appendChild(d); }
  } else mm && mm.remove();
  const v = S.pub.versions || {}; if (v.minVersion && CFG.APP_VERSION < v.minVersion && v.forceUpdate && !$('#fupd')) {
    const d = document.createElement('div'); d.id = 'fupd'; d.className = 'lock'; d.innerHTML = `<div class="logo" style="width:56px;height:56px">${ic('download')}</div><h2>Update required</h2><p class="muted center" style="max-width:340px">Version ${esc(v.latest || v.minVersion)} is required. ${esc(v.notes || '')}</p>${v.url ? `<a class="btn primary" href="${esc(v.url)}">Update now</a>` : ''}`; document.body.appendChild(d); }
  else if (v.latest && CFG.APP_VERSION < v.latest && !sessionStorage.getItem('bz_upd')) { sessionStorage.setItem('bz_upd', 1); setTimeout(() => modal({ title: 'Update available', size: 'sm', body: `<p>BillZo ${esc(v.latest)} is available.</p><p class="small muted mt8">${esc(v.notes || '')}</p>`, foot: `<button class="btn" onclick="this.closest('.ov').close()">Later</button>${v.url ? `<a class="btn primary" href="${esc(v.url)}" target="_blank">Update</a>` : ''}` }), 1500); }
  if (S.user && S.bizId && $('#view')) { renderShell(true); }
}

/* ---- auth ---- */
auth.onAuthStateChanged(async u => {
  if (!u) { S.user = null; return renderOnboard('start'); }
  S.user = u; await IDB.open(); if (S.creating) return; PENDING = (await IDB.get('pending_' + u.uid)) || {};
  const cachedP = await IDB.get('p_' + u.uid);
  let prof = cachedP && cachedP.onboarded ? cachedP : null; // instant login from device cache; live profile listener refreshes it
  if (!prof) { try { prof = (await tmo(db.ref(`users/${u.uid}/profile`).once('value'), 4000, null))?.val() || null; } catch (e) { prof = null; } }
  if (!prof) prof = cachedP;
  if (!prof) { S.profile = { name: u.displayName || '', email: u.email }; S.ob = { name: S.profile.name, email: u.email }; return renderOnboard('lang'); }
  S.profile = prof; IDB.set('p_' + u.uid, prof);
  if (['blocked', 'suspended', 'deleted'].includes(prof.status)) { await auth.signOut(); return renderOnboard('login', `Your account is ${prof.status}. Contact support.`); }
  if (!prof.onboarded) { S.ob = { name: prof.name, email: prof.email, phone: prof.phone }; return renderOnboard('lang'); }
  if (prof.lang) setLang(prof.lang);
  startSession(); await loadBiz(prof.activeBiz);
});
function startSession() {
  const u = S.user.uid, di = deviceInfo(), sid = sessionStorage.getItem('bz_sid') || gid(); sessionStorage.setItem('bz_sid', sid);
  if (!sessionStorage.getItem('bz_logged')) { db.ref(`users/${u}/logins`).push({ at: Date.now(), ...di, v: CFG.APP_VERSION, mode: MODE }); sessionStorage.setItem('bz_logged', 1); }
  db.ref(`users/${u}/profile`).update({ lastActive: Date.now(), device: di, appVersion: CFG.APP_VERSION });
  const sref = db.ref(`users/${u}/sessions/${sid}`); sref.set({ at: Date.now(), ...di, mode: MODE }); 
  const pres = db.ref(`presence/${u}`); db.ref('.info/connected').on('value', s => { if (s.val()) { pres.onDisconnect().remove(); pres.set({ at: Date.now(), name: S.profile.name || '', type: di.type, v: CFG.APP_VERSION }); } });
  setInterval(() => db.ref(`users/${u}/profile/lastActive`).set(Date.now()), 300000);
  db.ref(`users/${u}/profile`).on('value', s => { const p = s.val(); if (!p) return; const old = S.profile; S.profile = p; IDB.set('p_' + u, p);
    if (['blocked', 'suspended', 'deleted'].includes(p.status)) { toast('Account ' + p.status + ' by admin', 'err'); return logout(true); }
    if (p.forceLogout && p.forceLogout > (+sessionStorage.getItem('bz_start') || 0)) { toast('Signed out by admin', 'err'); return logout(true); }
    if (old && (old.plan !== p.plan || JSON.stringify(old.featureOverrides) !== JSON.stringify(p.featureOverrides))) renderShell(true); });
  sessionStorage.setItem('bz_start', sessionStorage.getItem('bz_start') || Date.now());
  db.ref(`users/${u}/sessions/${sid}/kill`).on('value', s => { if (s.val()) { sref.remove(); logout(true); } });
  db.ref(`users/${u}/notifications`).limitToLast(60).on('value', s => { S.notes = s.val() || {}; updBell(); 
    const fresh = vals(S.notes).filter(n => !n.read && !n.shown && n.at > Date.now() - 864e5); fresh.forEach(n => { toast(n.title, 'ok'); db.ref(`users/${u}/notifications/${n.id}/shown`).set(true); }); });
  initPush();
}
function initPush() {
  if (!CFG.onesignalAppId || location.protocol === 'file:') return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  const s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true; document.head.appendChild(s);
  OneSignalDeferred.push(async OS => { try { await OS.init({ appId: CFG.onesignalAppId, allowLocalhostAsSecureOrigin: true }); await OS.login(S.user.uid); OS.User.addTags({ category: S.profile.category || '', plan: S.profile.plan || 'free' }); } catch (e) { console.warn('OneSignal', e); } });
}
async function logout(force) {
  if (!force && !(await confirmBox('Log out of BillZo on this device?', { ok: t('logout') }))) return;
  try { db.ref(`presence/${S.user.uid}`).remove(); db.ref(`users/${S.user.uid}/logins`).push({ at: Date.now(), type: 'logout', ...deviceInfo() }); } catch (e) {}
  sessionStorage.clear(); await auth.signOut(); location.reload();
}

/* ---- business loading ---- */
let bizRef = null;
async function loadBiz(prefer) {
  const u = S.user.uid;
  const cachedBl = await IDB.get('bl_' + u); const listSnap = cachedBl && Object.keys(cachedBl).length ? null : await tmo(db.ref(`users/${u}/bizList`).once('value').catch(() => null), 4000, null);
  S.bizList = listSnap?.val() || cachedBl || {}; if (cachedBl) db.ref(`users/${u}/bizList`).once('value').then(x => { const v = x.val(); if (v) { S.bizList = v; IDB.set('bl_' + u, v); updBizChip(); } }).catch(() => {});
  if (!Object.keys(S.bizList).length) { const id = gid(); const info = defaultBizInfo(id); S.bizList[id] = { id, name: info.name }; W(`users/${u}/bizList/${id}`, S.bizList[id]); W(`users/${u}/biz/${id}/info`, info); }
  IDB.set('bl_' + u, S.bizList);
  S.bizId = S.bizList[prefer] ? prefer : Object.keys(S.bizList)[0];
  const cached = await IDB.get(`c_${u}_${S.bizId}`);
  if (cached) { S.info = cached.info || {}; COLS.forEach(c => S.d[c] = cached.d?.[c] || {}); recalc(); renderShell(); }
  else renderShell();
  if (bizRef) bizRef.off();
  bizRef = db.ref(`users/${u}/biz/${S.bizId}`);
  bizRef.on('value', s => { const v = s.val() || {}; S.info = v.info || S.info || defaultBizInfo(S.bizId); COLS.forEach(c => S.d[c] = v[c] || {});
    for (const p of Object.values(PENDING)) applyPendingLocal(p); recalc(); cacheLocal(); updBizChip(); rerender(); runAutomations(); }, e => toast('Sync error: ' + e.message, 'err'));
}
function updBizChip() { const n = $('#bizn'); if (n) n.textContent = S.info.name || 'Business'; const a = $('#bizsw .av'); if (a) a.innerHTML = S.info.logo ? `<img src="${S.info.logo}">` : initials(S.info.name); }
function applyPendingLocal(p) { const pre = `users/${S.user.uid}/biz/${S.bizId}/`; if (!p.path.startsWith(pre)) return; const [c, id] = p.path.slice(pre.length).split('/'); if (S.d[c] && id) { if (p.value === null) delete S.d[c][id]; else S.d[c][id] = p.value; } }
function defaultBizInfo(id) {
  const P = S.profile || {};
  return { id, name: P.bizName || (P.name ? P.name + ' Enterprises' : 'My Business'), owner: P.name || '', phone: P.phone || '', email: P.email || '', category: P.category || '', subCategory: P.subCategory || '',
    gstType: P.gstType || 'nongst', gstin: P.gstin || '', state: (P.gstin || '').slice(0, 2) || '27', address: '', createdAt: Date.now(), status: 'active',
    settings: { prefix: {}, suffix: '', counter: {}, template: 'modern', color: '#0E6E5C', terms: '1. Goods once sold will not be taken back.\n2. Subject to local jurisdiction.', roundOff: true, inclusive: false, showHsn: true, lowStockDefault: 5, upi: '', bank: '' } };
}
function switchBiz(id) { S.bizId = id; db.ref(`users/${S.user.uid}/profile/activeBiz`).set(id); S.branch = ''; loadBiz(id); go('dashboard'); }

  <div class="feat"><div>${ic('file')} GST invoices</div><div>${ic('box')} Inventory</div><div>${ic('wallet')} Udhaar khata</div><div>${ic('chart')} Reports</div><div>${ic('wifioff')} Works offline</div><div>${ic('globe')} 13+ languages</div></div></div>

  for (const i of vals(S.d.items)) { const ex = [i.expiry, ...(i.batches || []).map(b => b.expiry)].filter(Boolean);
    for (const e of ex) if (e <= in30) A.push({ k: 'expiry', ic: 'alert', c: e < td ? 'bad' : 'warn', t: `${i.name} ${e < td ? 'expired' : 'expiring'} on ${fdate(e)}`, s: 'Expiry alert', go: ['itemView', { id: i.id }] }); }
  for (const i of activeInv(['sale'])) { const d = due(i); if (d > 0.01 && i.dueDate && i.dueDate <= in3) A.push({ k: 'due', ic: 'clock', c: i.dueDate < td ? 'bad' : 'warn', t: `${i.partyName || 'Customer'} owes ${inr0(d)} on ${i.no}`, s: `Due ${fdate(i.dueDate)}`, go: ['invoiceView', { id: i.id }], remind: i.id }); }
  for (const i of activeInv(['purchase'])) { const d = due(i); if (d > 0.01 && i.dueDate && i.dueDate <= in3) A.push({ k: 'due', ic: 'clock', c: 'warn', t: `Pay ${inr0(d)} to ${i.partyName} (${i.no})`, s: `Due ${fdate(i.dueDate)}`, go: ['invoiceView', { id: i.id }] }); }
  for (const i of activeInv(['sale_order', 'purchase_order'])) if (!i.converted) A.push({ k: 'order', ic: 'cart', c: 'info', t: `${TYPES[i.type].l} ${i.no} is pending`, s: `${i.partyName || ''} · ${inr0(i.totals.total)}`, go: ['invoiceView', { id: i.id }] });
  for (const i of activeInv(['estimate', 'proforma'])) if (!i.converted && i.validTill && i.validTill <= in3) A.push({ k: 'invoice', ic: 'file', c: 'info', t: `${i.no} validity ends ${fdate(i.validTill)}`, s: i.partyName || '', go: ['invoiceView', { id: i.id }] });
  const md = d => d ? d.slice(5) : ''; const next7 = [...Array(8)].map((_, n) => md(addDays(td, n)));
  for (const p of vals(S.d.parties)) { if (p.dob && next7.includes(md(p.dob))) A.push({ k: 'bday', ic: 'cake', c: 'pri', t: `${p.name}'s birthday ${md(p.dob) === md(td) ? 'is today' : 'on ' + fdate(new Date().getFullYear() + '-' + md(p.dob))}`, s: 'Send wishes', wish: p.id }); }
  for (const p of vals(S.d.payments)) if (p.mode === 'cheque' && p.chequeStatus !== 'cleared' && p.chequeStatus !== 'bounced' && p.chequeDate && p.chequeDate <= td) A.push({ k: 'cheque', ic: 'bank', c: 'warn', t: `Cheque ${p.ref || ''} of ${inr0(p.amount)} due for clearance`, s: party(p.partyId)?.name || '', pay: p.id });
  for (const i of vals(S.d.invoices)) if (i.recurring?.on && i.recurring.next && i.recurring.next <= in3) A.push({ k: 'invoice', ic: 'repeat', c: 'info', t: `Recurring bill ${i.no} next on ${fdate(i.recurring.next)}`, s: i.partyName || '', go: ['invoiceView', { id: i.id }] });
  return A;
}

/* ---- automations: recurring bills & expenses ---- */
function runAutomations() {
  if (S._auto === today() + S.bizId) return; S._auto = today() + S.bizId; const td = today();
  for (const i of vals(S.d.invoices)) { let g = 0; while (i.recurring?.on && i.recurring.next && i.recurring.next <= td && g++ < 12) {
    const c = JSON.parse(JSON.stringify(i)); delete c.id; c.recurring = null; c.date = i.recurring.next; c.dueDate = c.dueDate ? addDays(c.date, num(i.recurring.terms || 0)) : ''; c.no = nextNo(c.type); c.refId = i.id; c.auto = true; save('invoices', c, { log: false }); bumpNo(c.type);
    i.recurring.next = nextDate(i.recurring.next, i.recurring.freq); save('invoices', i, { log: false }); act('Auto-created recurring bill', c.no); } }
  for (const e of vals(S.d.expenses)) { let g = 0; while (e.recurring && e.next && e.next <= td && g++ < 12) {
    const c = { ...e }; delete c.id; c.recurring = false; c.date = e.next; c.refId = e.id; save('expenses', c, { log: false }); e.next = nextDate(e.next, e.freq || 'monthly'); save('expenses', e, { log: false }); } }
}
const nextDate = (d, f) => { const x = new Date(d); if (f === 'daily') x.setDate(x.getDate() + 1); else if (f === 'weekly') x.setDate(x.getDate() + 7); else if (f === 'quarterly') x.setMonth(x.getMonth() + 3); else if (f === 'yearly') x.setFullYear(x.getFullYear() + 1); else x.setMonth(x.getMonth() + 1); return dstr(x); };

function pinPad(title, onDone, sub = '') {
  const d = document.createElement('div'); d.className = 'lock'; let v = '';
  const draw = () => { d.innerHTML = `<div class="logo" style="width:54px;height:54px">${ic('lock')}</div><h2>${title}</h2><div class="muted small">${sub}</div><div class="pindots">${[0, 1, 2, 3].map(i => `<i class="${i < v.length ? 'f' : ''}"></i>`).join('')}</div>
   <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '⌫'].map(k => `<button data-k="${k}">${k === 'x' ? ic('x') : k}</button>`).join('')}</div>`;
    $$('[data-k]', d).forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '⌫') v = v.slice(0, -1); else if (k === 'x') { if (onDone(null, d) !== false) d.remove(); return; } else if (v.length < 4) v += k; draw(); if (v.length === 4) setTimeout(async () => { const r = await onDone(v, d); if (r === false) { v = ''; draw(); d.querySelector('.pindots').animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], 250); } else d.remove(); }, 120); }); };
  draw(); document.body.appendChild(d); return d;
}

function cashFlows(mode = 'cash') { const F = []; const isC = m => mode === 'cash' ? m === 'cash' : m !== 'cash';
  for (const p of vals(S.d.payments)) if (isC(p.mode) && !(p.mode === 'cheque' && p.chequeStatus === 'bounced')) F.push({ date: p.date, at: p.createdAt, inA: p.dir === 'in' ? num(p.amount) : 0, outA: p.dir === 'out' ? num(p.amount) : 0, t: (p.partyName || 'Cash adjustment') + (p.invoiceNo ? ' · ' + p.invoiceNo : ''), mode: p.mode, id: p.id, k: 'pay' });
  for (const e of vals(S.d.expenses)) if (isC(e.mode || 'cash')) F.push({ date: e.date, at: e.createdAt, inA: 0, outA: num(e.amount), t: 'Expense: ' + e.cat + (e.note ? ' · ' + e.note : ''), mode: e.mode || 'cash', id: e.id, k: 'exp' });
  return F.sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at)); }
function cashBalance(upto) { const o = num(S.info.settings?.openingCash); return o + sum(cashFlows().filter(f => f.date <= upto), f => f.inA - f.outA); }

setInterval(() => { if (S.user && S.bizId && S.online && S.info.settings && S.info.settings.autoBackup !== false && feat('backup') && Date.now() - num(S.info.settings.lastBackup) > 7 * 864e5 && vals(S.d.invoices).length) cloudBackup(true); }, 60000);

/* ---- HELP & SUPPORT ---- */
R.help = v => {
  const tab = S.params.tab || 'tickets'; const faqs = vals(S.pub.faqs).filter(f => f.active !== false).sort((a, b) => num(a.order) - num(b.order)); const tuts = vals(S.pub.tutorials).filter(x => x.active !== false);
  v.innerHTML = `<div class="ph"><h2>${t('help')}</h2><span class="sp"></span><button class="btn primary" onclick="newTicket()">${ic('plus')} New ticket</button></div>
  <div class="pill-tabs mb12">${[['tickets', 'My tickets'], ['faq', 'FAQ'], ['tutorials', 'Tutorials'], ['articles', 'Help articles'], ['contact', 'Contact']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div><div id="hc"></div>`;
  $$('[data-tab]', v).forEach(b => b.onclick = () => go('help', { tab: b.dataset.tab })); const c = $('#hc');
  if (tab === 'tickets') db.ref(`users/${S.user.uid}/tickets`).once('value', sn => { const L = vals(sn.val()).sort((a, b) => (b.updatedAt || b.at) - (a.updatedAt || a.at)); c.innerHTML = `<div class="card p0">${L.map(x => `<div class="li" data-id="${x.id}">${ic('ticket')}<div class="mn"><div class="t1">${esc(x.subject)}</div><div class="t2">#${x.id.slice(-6).toUpperCase()} · ${esc(x.cat)} · ${ago(x.updatedAt || x.at)}</div></div><span class="badge ${x.status === 'resolved' || x.status === 'closed' ? 'ok' : x.status === 'pending' ? 'warn' : 'info'}">${esc(x.status)}</span></div>`).join('') || emptyState('ticket', 'No tickets yet. Our team usually replies within a day.')}</div>`; $$('[data-id]', c).forEach(r => r.onclick = () => ticketView(r.dataset.id)); });
  if (tab === 'faq') c.innerHTML = faqs.length ? faqs.map(f => `<details class="card mb8"><summary class="sb" style="cursor:pointer">${esc(f.q)}</summary><p class="mt8 muted" style="white-space:pre-line">${esc(f.a)}</p></details>`).join('') : emptyState('help', 'FAQs coming soon');
  if (tab === 'tutorials') c.innerHTML = `<div class="grid g3">${tuts.map(x => `<a class="card" href="${esc(x.url || '#')}" target="_blank"><div class="kpi"><div class="ico">${ic('eye')}</div></div><div class="sb mt8">${esc(x.title)}</div><div class="small muted">${esc(x.desc || '')}</div></a>`).join('') || emptyState('eye', 'Tutorials coming soon')}</div>`;
  if (tab === 'articles') c.innerHTML = `<div class="card p0">${vals(S.pub.articles).filter(a => a.active !== false).map(a => `<div class="li" data-a="${a.id}">${ic('book')}<div class="mn t1">${esc(a.title)}</div></div>`).join('') || emptyState('book', 'No articles yet')}</div>`, $$('[data-a]', c).forEach(r => r.onclick = () => { const a = S.pub.articles[r.dataset.a]; modal({ title: esc(a.title), size: 'wide', body: `<div style="white-space:pre-line;line-height:1.7">${esc(a.body)}</div>` }); });
  if (tab === 'contact') { const ct = S.pub.cms?.contact; c.innerHTML = `<div class="card"><div style="white-space:pre-line">${esc(ct?.body || 'Raise a ticket and our support team will get back to you.')}</div></div>`; }
};
function newTicket(pre = {}) {
  const F = [{ k: 'cat', l: 'Category', t: 'select', opts: ['Question', 'Bug report', 'Feature request', 'Complaint', 'Feedback', 'Plan / subscription', 'Account'] }, { k: 'priority', l: 'Priority', t: 'select', opts: ['low', 'medium', 'high', 'urgent'] }, { k: 'subject', l: 'Subject', req: 1 }, { k: 'msg', l: 'Describe the issue', t: 'textarea', req: 1 }, { k: 'img', l: 'Attachment (screenshot)', t: 'image' }];
  modal({ title: 'New support ticket', body: formHTML(F, { priority: 'medium', ...pre }), foot: `<button class="btn primary" data-s>${ic('send')} Submit</button>`, onOpen: (m, c) => { bindImages(m); $('[data-s]', m).onclick = async () => { const o = readForm(m, F); if (!o) return; const id = gid();
    await db.ref(`users/${S.user.uid}/tickets/${id}`).set({ id, uid: S.user.uid, name: S.profile.name, email: S.user.email, biz: S.info.name, category: S.profile.category || '', cat: o.cat, priority: o.priority, subject: o.subject, status: 'new', at: Date.now(), updatedAt: Date.now(), device: deviceInfo(), v: CFG.APP_VERSION, msgs: { [gid()]: { from: 'user', text: o.msg, img: o.img || '', at: Date.now() } } });
    c(); toast('Ticket submitted'); if (S.route === 'help') rerender(); }; } });
}
function ticketView(id) { const ref = db.ref(`users/${S.user.uid}/tickets/${id}`);
  const m = modal({ title: 'Ticket #' + id.slice(-6).toUpperCase(), size: 'wide', body: '<div class="empty"><span class="spin"></span></div>', foot: `<input class="in" id="trp" placeholder="Write a reply…" style="flex:1"><button class="btn primary" id="trs">${ic('send')}</button>`, onClose: () => ref.off() });
  ref.on('value', sn => { const x = sn.val(); if (!x) return; $('.mb', m).innerHTML = `<div class="row mb12"><b class="sp">${esc(x.subject)}</b><span class="badge">${esc(x.cat)}</span><span class="badge ${x.status === 'resolved' ? 'ok' : 'info'}">${esc(x.status)}</span></div>` + vals(x.msgs).filter(z => !z.internal).sort((a, b) => a.at - b.at).map(z => `<div style="display:flex;justify-content:${z.from === 'user' ? 'flex-end' : 'flex-start'};margin-bottom:10px"><div style="max-width:80%;padding:10px 12px;border-radius:12px;background:${z.from === 'user' ? 'var(--psoft)' : 'var(--surface2)'}"><div class="xs muted mb8">${z.from === 'user' ? 'You' : esc(z.agent || 'BillZo Support')} · ${ftime(z.at)}</div><div style="white-space:pre-line">${esc(z.text)}</div>${z.img ? `<img src="${z.img}" style="max-width:220px;border-radius:8px;margin-top:6px">` : ''}</div></div>`).join(''); });
  $('#trs', m).onclick = () => { const tx = $('#trp', m).value.trim(); if (!tx) return; ref.child('msgs').push({ from: 'user', text: tx, at: Date.now() }); ref.update({ updatedAt: Date.now(), status: 'pending' }); $('#trp', m).value = ''; }; }

/* ---- boot ---- */
if (sessionStorage.getItem('bz_staff')) { const sid = sessionStorage.getItem('bz_staff'); const iv = setInterval(() => { if (S.d.staff[sid]) { S.staff = S.d.staff[sid]; clearInterval(iv); renderShell(); } }, 500); setTimeout(() => clearInterval(iv), 10000); }
window.addEventListener('online', () => { S.online = true; updNet(); flushPending(); toast('Back online — syncing'); });
window.addEventListener('offline', () => { S.online = false; updNet(); toast('Offline — bills will sync later', 'err'); });

</script>
</body></html>
